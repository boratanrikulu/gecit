name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-bpf:
    name: Compile BPF objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev libbpf-dev

      - name: Compile BPF (x86 + arm64)
        run: make bpf-all

      - name: Upload BPF objects
        uses: actions/upload-artifact@v4
        with:
          name: bpf-objects
          path: pkg/ebpf/bpf/bin/

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-bpf
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            cgo: 0
            tags: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            cgo: 0
            tags: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            cgo: 1
            tags: with_gvisor
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            cgo: 1
            tags: with_gvisor
          - os: windows
            arch: amd64
            runner: ubuntu-latest
            cgo: 0
            tags: with_gvisor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download BPF objects
        uses: actions/download-artifact@v4
        with:
          name: bpf-objects
          path: pkg/ebpf/bpf/bin/

      - name: Install libpcap (macOS)
        if: matrix.os == 'darwin'
        run: brew install libpcap || true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          TAGS=""
          if [ -n "${{ matrix.tags }}" ]; then TAGS="-tags ${{ matrix.tags }}"; fi
          go build -ldflags="-s -w" $TAGS -o gecit-${{ matrix.os }}-${{ matrix.arch }}${EXT} ./cmd/gecit

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gecit-${{ matrix.os }}-${{ matrix.arch }}
          path: gecit-${{ matrix.os }}-${{ matrix.arch }}*

  msi:
    name: Build MSI
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: gecit-windows-amd64

      # MSI versions are numeric, so the tag maps rather than passes through.
      # A candidate becomes a fourth field, v0.2.0-rc1 -> 0.2.0.1. MSI compares
      # only the first three, so the candidate and its release are the same
      # version to the installer and AllowSameVersionUpgrades is what lets the
      # release install over it. The filename keeps the tag, which is easier to
      # recognise than the numeric form.
      - name: Resolve MSI version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -match '^v(\d+\.\d+\.\d+)(?:-rc\.?(\d+))?$') {
            $version = $Matches[1]
            $rc = if ($Matches[2]) { [int]$Matches[2] } else { 0 }
            if ($Matches[2] -and ($rc -lt 1 -or $rc -gt 65535)) {
              # Skip rather than fail: the release job needs this one, and a
              # mistyped tag should still publish its binaries.
              Write-Host "candidate number must be 1-65535, got $rc, skipping the MSI"
              "version=" >> $env:GITHUB_OUTPUT
              "label=" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($rc -gt 0) { $version = "$version.$rc" }
            "version=$version" >> $env:GITHUB_OUTPUT
            "label=$($tag -replace '^v','')" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "$tag is not a release or release-candidate tag, skipping the MSI"
            "version=" >> $env:GITHUB_OUTPUT
            "label=" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.version != ''
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        if: steps.version.outputs.version != ''
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add -g WixToolset.UI.wixext/6.0.1

      - name: Build MSI
        if: steps.version.outputs.version != ''
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Label "${{ steps.version.outputs.label }}" `
            -BinaryPath ./gecit-windows-amd64.exe
          Move-Item packaging/windows/*.msi .

      - name: Upload MSI
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: gecit-windows-amd64-msi
          path: '*.msi'
          if-no-files-found: error

      # The .wixpdb is what makes a failed install diagnosable later.
      - name: Upload build symbols
        if: always() && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: msi-wixpdb
          path: packaging/windows/*.wixpdb
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, msi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release/
          for dir in artifacts/gecit-*/; do
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              cp "$file" "release/$name"
              chmod +x "release/$name"
              sha256sum "release/$name" >> release/checksums.txt
            done
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/gecit-linux-amd64
            release/gecit-linux-arm64
            release/gecit-darwin-amd64
            release/gecit-darwin-arm64
            release/gecit-windows-amd64.exe
            release/*.msi
            release/checksums.txt
