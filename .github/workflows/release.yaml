name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-bpf:
    name: Compile BPF objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev libbpf-dev

      - name: Compile BPF (x86 + arm64)
        run: make bpf-all

      # The bindings are gitignored and generated by gobee, so the build legs
      # have no copy of them unless this artifact carries one. The artifact is
      # rooted at pkg/ebpf/bpf, the common parent of both paths.
      - name: Upload BPF objects
        uses: actions/upload-artifact@v4
        with:
          name: bpf-objects
          path: |
            pkg/ebpf/bpf/bin/
            pkg/ebpf/bpf/sockops_bindings.go

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build-bpf
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            cgo: 0
            tags: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            cgo: 0
            tags: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            cgo: 1
            tags: with_gvisor
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            cgo: 1
            tags: with_gvisor
          - os: windows
            arch: amd64
            runner: ubuntu-latest
            cgo: 0
            tags: with_gvisor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Linux only. Nothing else imports pkg/ebpf, and the bindings carry no
      # build constraint while importing golang.org/x/sys/unix, so in a
      # Windows tree they break any command that walks ./...
      - name: Download BPF objects
        if: matrix.os == 'linux'
        uses: actions/download-artifact@v4
        with:
          name: bpf-objects
          path: pkg/ebpf/bpf/

      - name: Install libpcap (macOS)
        if: matrix.os == 'darwin'
        run: brew install libpcap || true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          TAGS=""
          if [ -n "${{ matrix.tags }}" ]; then TAGS="-tags ${{ matrix.tags }}"; fi
          VERSION=${GITHUB_REF_NAME#v}
          STAMP=github.com/boratanrikulu/gecit/cmd/gecit/app.version=$VERSION
          go build -ldflags="-s -w -X $STAMP" $TAGS -o gecit-${{ matrix.os }}-${{ matrix.arch }}${EXT} ./cmd/gecit

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gecit-${{ matrix.os }}-${{ matrix.arch }}
          path: gecit-${{ matrix.os }}-${{ matrix.arch }}*

  msi:
    name: Build MSI
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: gecit-windows-amd64

      # MSI versions are numeric, so the tag maps rather than passes through.
      # A candidate becomes a fourth field, v0.2.0-rc.1 -> 0.2.0.1. MSI compares
      # only the first three, so the candidate and its release are the same
      # version to the installer and AllowSameVersionUpgrades is what lets the
      # release install over it. The filename keeps the tag, which is easier to
      # recognise than the numeric form.
      #
      # The dot in -rc.N is required, not decorative. It makes the number a
      # numeric identifier under SemVer, so rc.10 sorts after rc.2. Written
      # rc10 it is one alphanumeric identifier compared as text, and rc10 would
      # sort before rc2 for anyone running `go install`.
      - name: Resolve MSI version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -match '^v(\d+\.\d+\.\d+)(?:-rc\.(\d+))?$') {
            $version = $Matches[1]
            $rc = if ($Matches[2]) { [int]$Matches[2] } else { 0 }
            if ($Matches[2] -and ($rc -lt 1 -or $rc -gt 65535)) {
              # Skip rather than fail: the release job needs this one, and a
              # mistyped tag should still publish its binaries.
              Write-Host "candidate number must be 1-65535, got $rc, skipping the MSI"
              "version=" >> $env:GITHUB_OUTPUT
              "label=" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($rc -gt 0) { $version = "$version.$rc" }
            "version=$version" >> $env:GITHUB_OUTPUT
            "label=$($tag -replace '^v','')" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "$tag is not vX.Y.Z or vX.Y.Z-rc.N, skipping the MSI"
            "version=" >> $env:GITHUB_OUTPUT
            "label=" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.version != ''
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        if: steps.version.outputs.version != ''
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add -g WixToolset.UI.wixext/6.0.1

      - name: Build MSI
        if: steps.version.outputs.version != ''
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Label "${{ steps.version.outputs.label }}" `
            -BinaryPath ./gecit-windows-amd64.exe
          Move-Item packaging/windows/*.msi .

      - name: Upload MSI
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: gecit-windows-amd64-msi
          path: '*.msi'
          if-no-files-found: error

      # The .wixpdb is what makes a failed install diagnosable later.
      - name: Upload build symbols
        if: always() && steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: msi-wixpdb
          path: packaging/windows/*.wixpdb
          if-no-files-found: ignore
          retention-days: 7

  packages:
    name: Build packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      # For `go install nfpm`. Nothing here compiles gecit: the binaries come
      # from the matrix, which is the only place that can build darwin with cgo.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage binaries
        run: |
          mkdir -p bin
          for os in linux darwin; do
            for arch in amd64 arm64; do
              cp "artifacts/gecit-$os-$arch/gecit-$os-$arch" "bin/gecit-$os-$arch"
            done
          done
          chmod +x bin/*

      # dpkg rejects a version that does not start with a digit and rpm rejects
      # one containing a hyphen, so a mistyped tag would otherwise publish
      # packages nobody can install. The MSI job guards its own version the same
      # way. Failing here is deliberate: `release` needs this job, and a broken
      # asset is worse than a missing one.
      - name: Check the tag shape
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

      - name: Build Linux packages and macOS tarballs
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          make packages-linux VERSION="$VERSION"
          make tarball-darwin VERSION="$VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: gecit-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, msi, packages]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Only artifacts/gecit-*/ on purpose. bpf-objects/ holds two files both
      # named sockops.bpf.o, and msi-wixpdb/ is a debugging aid, not an asset.
      - name: Prepare release assets
        run: |
          mkdir -p release/
          for dir in artifacts/gecit-*/; do
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              cp "$file" "release/$(basename "$file")"
            done
          done
          chmod +x release/gecit-linux-amd64 release/gecit-linux-arm64 \
                   release/gecit-darwin-amd64 release/gecit-darwin-arm64
          (cd release && sha256sum -- *) > "$RUNNER_TEMP/checksums.txt"
          cp "$RUNNER_TEMP/checksums.txt" release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Without this a glob that matches nothing is silent, and the tap job
          # would publish a cask whose download URL 404s.
          fail_on_unmatched_files: true
          files: |
            release/gecit-linux-amd64
            release/gecit-linux-arm64
            release/gecit-darwin-amd64
            release/gecit-darwin-arm64
            release/gecit-windows-amd64.exe
            release/gecit_*_linux_*.deb
            release/gecit_*_linux_*.rpm
            release/gecit_*_linux_*.apk
            release/gecit_*_darwin_*.tar.gz
            release/*.msi
            release/checksums.txt

  tap:
    name: Publish Homebrew cask
    runs-on: ubuntu-latest
    needs: release
    # HOMEBREW_TAP_GITHUB_TOKEN is an environment secret. A job without this
    # line reads it as an empty string and the push to the tap fails.
    environment: release
    steps:
      # The workspace token has no business sitting next to a cross-repo write
      # token; publish.sh brings its own credentials.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: gecit-packages
          path: dist/

      # A candidate publishes its assets and stops there. Pushing the cask
      # would hand everyone running `brew install` an rc.
      - name: Publish cask
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$GITHUB_REF_NAME is not a stable release, leaving the tap alone"
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          packaging/homebrew/publish.sh "$VERSION" \
            "dist/gecit_${VERSION}_darwin_amd64.tar.gz" \
            "dist/gecit_${VERSION}_darwin_arm64.tar.gz"
